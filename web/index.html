    <script>
      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          mutation.addedNodes.forEach(function (node) {
            if (
              node.nodeName === "META" &&
              node.getAttribute("name") === "viewport"
            ) {
              var content = node.getAttribute("content") || "";
              if (content.indexOf("user-scalable=no") !== -1) {
                node.setAttribute(
                  "content",
                  "width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes",
                );
              }
            }
          });
        });
      });
      observer.observe(document.head, { childList: true });

      function onFlutterReady() {
        var splash = document.getElementById("web-splash");
        if (splash) {
          splash.remove();
        }
      }
      window.addEventListener("flutter-first-frame", onFlutterReady);
      setTimeout(onFlutterReady, 800);
    </script>
