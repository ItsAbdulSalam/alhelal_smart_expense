    <style id="splash-screen-style">
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #030816;
        overflow: hidden;
      }
      #web-splash {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0a1738 0%, #030816 100%);
      }
      .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 40px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .splash-logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      .app-title {
        margin-top: 20px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 20px;
        font-weight: 700;
        color: #f1f5f9;
      }
      .app-subtitle {
        margin-top: 4px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 12px;
        color: #38bdf8;
        font-weight: 500;
      }
      .loading-bar {
        margin-top: 24px;
        width: 120px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }
      .loading-progress {
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: #38bdf8;
        border-radius: 3px;
        animation: loadStream 1.2s infinite linear;
      }
      @keyframes loadStream {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }
    </style>

  <body>

        </div>
      </div>
    </div>

    <script>
      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          mutation.addedNodes.forEach(function (node) {
            if (
              node.nodeName === "META" &&
              node.getAttribute("name") === "viewport"
            ) {
              var content = node.getAttribute("content") || "";
              if (content.indexOf("user-scalable=no") !== -1) {
                node.setAttribute(
                  "content",
                  "width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes",
                );
              }
            }
          });
        });
      });
      observer.observe(document.head, { childList: true });

      function onFlutterReady() {
        var splash = document.getElementById("web-splash");
        if (splash) {
          splash.remove();
        }
      }
      window.addEventListener("flutter-first-frame", onFlutterReady);
      setTimeout(onFlutterReady, 800);
    </script>

    <script src="flutter_bootstrap.js?v=12" async></script>
  </body>
