<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      try {
        if (typeof Intl !== "undefined") {
          Object.defineProperty(Intl, "v8BreakIterator", {
            configurable: true,
            enumerable: false,
            get: function () {
              return undefined;
            },
          });
        }
      } catch (e) {}
    </script>

    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <meta
      name="description"
      content="Alhelal Smart Expense - رفيقك المالي الذكي لإدارة وتحليل النفقات والفواتير بدقة متناهية عبر الذكاء الاصطناعي."
    />

    <meta name="theme-color" content="#030816" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Alhelal Smart Expense" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Alhelal Smart Expense</title>
    <link rel="manifest" href="manifest.json" />

    <style id="splash-screen-style">
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #030816;
        overflow: hidden;
      }
      #web-splash {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0a1738 0%, #030816 100%);
      }
      .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 40px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .splash-logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      .app-title {
        margin-top: 20px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 20px;
        font-weight: 700;
        color: #f1f5f9;
      }
      .app-subtitle {
        margin-top: 4px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 12px;
        color: #38bdf8;
        font-weight: 500;
      }
      .loading-bar {
        margin-top: 24px;
        width: 120px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }
      .loading-progress {
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: #38bdf8;
        border-radius: 3px;
        animation: loadStream 1.2s infinite linear;
      }
      @keyframes loadStream {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="web-splash">
      <div class="splash-card">
        <img
          class="splash-logo"
          src="icons/Icon-192.png"
          alt="Alhelal Smart Expense Logo"
          width="96"
          height="96"
          fetchpriority="high"
          onerror="
            this.onerror = null;
            this.src = 'favicon.png';
          "
        />
        <div class="app-title">Alhelal Smart Expense</div>
        <div class="app-subtitle">Powered by AI</div>
        <div class="loading-bar">
          <div class="loading-progress"></div>
        </div>
      </div>
    </div>

    <script>
      function onFlutterReady() {
        var splash = document.getElementById("web-splash");
        if (splash) {
          splash.remove();
        }
      }
      window.addEventListener("flutter-first-frame", onFlutterReady);
      setTimeout(onFlutterReady, 3500);
    </script>

    <!-- استخدام استدعاء محرك فلاتر مع ختم النسخة لمنع كاش الإقلاع نهائياً -->
    <script src="flutter_bootstrap.js?v=10" async></script>
  </body>
</html>
