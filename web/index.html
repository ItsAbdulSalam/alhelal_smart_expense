<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alhelal Smart Expense - رفيقك المالي الذكي لإدارة وتحليل النفقات والفواتير بدقة متناهية عبر الذكاء الاصطناعي."
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Alhelal Smart Expense" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Alhelal Smart Expense</title>
    <link rel="manifest" href="manifest.json" />

    <style id="splash-screen-style">
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #030816;
        overflow: hidden;
      }

      #web-splash {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0a1738 0%, #030816 100%);
        transition: opacity 0.4s ease-out;
      }

      .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 50px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.6),
          0 0 60px rgba(0, 212, 255, 0.12);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .splash-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        filter: drop-shadow(0 0 25px rgba(0, 212, 255, 0.35));
        animation: pulse 2.5s ease-in-out infinite;
      }

      .app-title {
        margin-top: 24px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #f1f5f9;
        letter-spacing: 0.5px;
      }

      .app-subtitle {
        margin-top: 6px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 13px;
        color: #38bdf8;
        font-weight: 500;
        letter-spacing: 1px;
      }

      .loading-bar {
        margin-top: 30px;
        width: 140px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }

      .loading-progress {
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #00d4ff, #38bdf8);
        border-radius: 3px;
        animation: loadStream 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes loadStream {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.25));
        }
        50% {
          transform: scale(1.03);
          filter: drop-shadow(0 0 35px rgba(0, 212, 255, 0.45));
        }
      }
    </style>
  </head>
  <body>
    <div id="web-splash">
      <div class="splash-card">
        <img
          class="splash-logo"
          src="icons/Icon-512.png"
          alt="Alhelal Smart Expense Logo"
          onerror="
            this.onerror = null;
            this.src = 'favicon.png';
          "
        />
        <div class="app-title">Alhelal Smart Expense</div>
        <div class="app-subtitle">Powered by AI</div>
        <div class="loading-bar">
          <div class="loading-progress"></div>
        </div>
      </div>
    </div>

    <script>
      function hideSplashScreen() {
        var splash = document.getElementById("web-splash");
        if (splash) {
          splash.style.opacity = "0";
          setTimeout(function () {
            splash.remove();
          }, 400);
        }
      }

      // إخفاء الشاشة بمجرد نزول محرك فلاتر ورسم أول ويدجت
      var observer = new MutationObserver(function (mutations, obs) {
        if (
          document.querySelector("flt-glass-pane") ||
          document.querySelector("flutter-view")
        ) {
          hideSplashScreen();
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // صمام أمان حتمي لمنع أي شاشة سوداء أو تعليق نهائياً بعد مرور 4 ثوانٍ
      setTimeout(hideSplashScreen, 4000);
    </script>

    <!-- المحرك الرسمي المدمج النظيف لـ Flutter Web -->
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
