<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <base href="/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Alhelal Smart Expense - نظام ذكي لإدارة المصاريف وتتبع الفواتير بدقة واحترافية."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Alhelal Smart Expense" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Alhelal Smart Expense</title>
    <link rel="manifest" href="manifest.json" />

    <!-- Preconnect & DNS-Prefetch للحفاظ على سرعة الشبكة و100 Best Practices -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      body {
        inset: 0;
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: fixed;
        background-color: #030712;
        user-select: none;
        -webkit-user-select: none;
      }

      #loading-indicator {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background-color: #030712;
        color: #f8fafc;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        transition: opacity 0.3s ease-out;
      }

      .spinner {
        width: 44px;
        height: 44px;
        border: 3.5px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="loading-indicator">
      <div class="spinner"></div>
    </div>

    <script src="flutter_bootstrap.js" async></script>

    <!-- سكربت التحديث التلقائي الفوري ومنع الكاش القديم -->
    <script>
      if ("serviceWorker" in navigator) {
        // عند تنزيل نسخة جديدة وتفعيلها، يتم تحديث الصفحة فوراً للعمل بالإصدار الجديد
        navigator.serviceWorker.addEventListener(
          "controllerchange",
          function () {
            window.location.reload();
          },
        );

        // إجبار المتصفح على فحص وتنزيل أي تحديث فور فتح الصفحة
        navigator.serviceWorker.ready.then(function (registration) {
          registration.update();
        });
      }

      // إخفاء مؤشر التحميل بسلاسة فور استقرار المحرك
      window.addEventListener("flutter-first-frame", function () {
        const loader = document.getElementById("loading-indicator");
        if (loader) {
          loader.style.opacity = "0";
          setTimeout(() => loader.remove(), 300);
        }
      });
    </script>
  </body>
</html>
