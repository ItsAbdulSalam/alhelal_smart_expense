<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="preload" href="main.dart.js" as="script" />
    <base href="/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alhelal Smart Expense - رفيقك المالي الذكي لإدارة وتحليل النفقات والفواتير بدقة متناهية عبر الذكاء الاصطناعي."
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Alhelal Smart Expense" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Alhelal Smart Expense</title>
    <link rel="manifest" href="manifest.json" />

    <style id="splash-screen-style">
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #030816;
        overflow: hidden;
      }

      #web-splash {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0a1738 0%, #030816 100%);
        transition: opacity 0.3s ease-out;
      }

      .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 40px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .splash-logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }

      .app-title {
        margin-top: 20px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 20px;
        font-weight: 700;
        color: #f1f5f9;
      }

      .app-subtitle {
        margin-top: 4px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 12px;
        color: #38bdf8;
        font-weight: 500;
      }

      .loading-bar {
        margin-top: 24px;
        width: 120px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }

      .loading-progress {
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: #38bdf8;
        border-radius: 3px;
        animation: loadStream 1.2s infinite linear;
      }

      @keyframes loadStream {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
    <!-- Preconnect to Google Fonts & WASM CDN for zero DNS latency -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
  </head>
  <body>
    <div id="web-splash">
      <div class="splash-card">
        <!-- استخدام Icon-192 بدلاً من 512 لتسريع التحميل والتخلص من تنبيه LCP/Image Delivery -->
        <img
          class="splash-logo"
          src="icons/Icon-192.png"
          alt="Alhelal Smart Expense Logo"
          width="96"
          height="96"
          fetchpriority="high"
          onerror="
            this.onerror = null;
            this.src = 'favicon.png';
          "
        />
        <div class="app-title">Alhelal Smart Expense</div>
        <div class="app-subtitle">Powered by AI</div>
        <div class="loading-bar">
          <div class="loading-progress"></div>
        </div>
      </div>
    </div>

    <script>
      function hideSplashScreen() {
        var splash = document.getElementById("web-splash");
        if (splash) {
          splash.style.opacity = "0";
          setTimeout(function () {
            splash.remove();
          }, 300);
        }
      }

      // فحص سريع خفيف بدون ثقل الـ MutationObserver على الـ Main Thread
      window.addEventListener("flutter-first-frame", hideSplashScreen);

      // صمام أمان بديل
      setTimeout(hideSplashScreen, 3000);
    </script>

    <!-- المحرك الرسمي النظيف لـ Flutter Web مع WASM -->
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
