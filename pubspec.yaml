name: alhelal_smart_expense
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_generative_ai: ^0.4.7
  image_picker: ^1.2.3
  intl:
  http: ^1.6.0
  fl_chart: ^1.2.0
  csv: ^8.0.0
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_dotenv: ^6.0.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  connectivity_plus: ^7.3.1
  share_plus: ^13.3.0
  flutter_localizations:
    sdk: flutter
  flutter_gen: ^5.15.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  web: ^1.1.1
  image: ^4.10.1
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon_full.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter_native_splash:
  color: "#000c2a" 
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#000c2a"
    image: "assets/icon/icon_fg.png"
    icon_background_color: "#000c2a"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/icon/
